<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <mat-icon class="login-icon">person</mat-icon>
      <h1 class="login-title">Вход в аккаунт</h1>
      <p class="login-subtitle">Введите ваши учетные данные</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field-wrapper">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix class="form-icon">email</mat-icon>
          <input matInput formControlName="email" type="email" placeholder="example@mail.com">
        </mat-form-field>
        <div class="form-error" *ngIf="shouldShowError('email')">
          <span *ngIf="loginForm.get('email')?.hasError('required')">
            Пожалуйста, введите ваш email!
          </span>
          <span *ngIf="loginForm.get('email')?.hasError('email')">
            Неверный формат email!
          </span>
        </div>
      </div>

      <div class="form-field-wrapper">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Пароль</mat-label>
          <mat-icon matPrefix class="form-icon">lock</mat-icon>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" placeholder="Пароль">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>
        <div class="form-error" *ngIf="shouldShowError('password')">
          <span *ngIf="loginForm.get('password')?.hasError('required')">
            Пожалуйста, введите пароль!
          </span>
        </div>
      </div>

      <div class="remember-wrapper">
        <mat-checkbox formControlName="remember" class="remember-checkbox">
          Запомнить меня
        </mat-checkbox>
      </div>

      <button mat-raised-button color="primary" class="login-button" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Войти</span>
        <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
      </button>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">или</span>
        <span class="divider-line"></span>
      </div>

      <div class="login-footer">
        <span class="register-text">Нет аккаунта? </span>
        <a routerLink="/register" class="register-link">
          Зарегистрироваться
        </a>
      </div>
    </form>
  </div>
</div>
